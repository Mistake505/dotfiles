[backdrop]
enabled = true

[bar]
order = [ "default", "islands" ]

    [bar.default]
    background_opacity = 0.79999998211860657
    capsule_radius = 0
    center = [ "cat_5", "date", "clock" ]
    enabled = true
    end = [
        "media",
        "nix_monitor_5",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "control-center",
        "session"
    ]
    font_family = "Maple Mono NF"
    margin_edge = 8
    margin_ends = 8
    radius = 0
    start = [ "launcher", "wallpaper", "workspaces", "active_window" ]

    [bar.islands]
    background_opacity = 0.0
    capsule = true
    capsule_fill = "surface"
    capsule_opacity = 0.79999998211860657
    capsule_radius = 0
    center = [ "cat_3", "date", "clock" ]
    enabled = false
    end = [
        "media",
        "nix_monitor_3",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "control-center",
        "session"
    ]
    font_family = "Maple Mono NF"
    margin_ends = 0
    radius = 0
    start = [ "launcher", "wallpaper", "workspaces", "active_window" ]

[control_center]
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = false

[dock]
background_opacity = 0.79999998211860657
concave_edge_corners = false
enabled = true
launcher_custom_image = "/home/ckjos/Downloads/nixos-artwork/logo/nix-snowflake-white.svg"
launcher_custom_image_colorize = true
launcher_position = "start"
margin_edge = 8
pinned = [
    "kitty",
    "librewolf",
    "org.gnome.Nautilus",
    "equibop",
    "org.vinegarhq.Sober",
    "org.prismlauncher.PrismLauncher",
    "steam"
]
radius = 0
reserve_space = false
smart_auto_hide = true

[hooks]
theme_mode_changed = "noctalia config export > dotfiles/noctalia/.config/noctalia/config.toml"
wallpaper_changed = "noctalia config export > dotfiles/noctalia/.config/noctalia/config.toml"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@WAYLAND-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1152.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 512.0
    cy = 394.0
    output = "WAYLAND-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 633.0
    cy = 1186.0
    output = "winit"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.79999998211860657

[osd]
background_opacity = 0.79999998211860657

[plugin_settings."avivbintangaringga/nix-monitor"]
panel_placement = "floating"
update_command = "sudo nixos-rebuild switch --upgrade"

[plugin_settings."dotnetrob/cat"]
panel_placement = "floating"

[plugins]
enabled = [ "dotnetrob/cat", "avivbintangaringga/nix-monitor" ]

[shell]
corner_radius_scale = 0.0
font_family = "Maple Mono NF"
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.launcher]
    categories = false

        [shell.launcher.providers.emoji]
        global = false

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.wallpaper]
        global = false

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

    [shell.session]
    grid = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Catppuccin Mocha Rosewater"
custom_palette = "Catppuccin Mocha Green"
source = "builtin"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "hyprland", "kitty", "mango", "niri", "qt" ]
    community_ids = [
        "pywalfox",
        "discord",
        "blender",
        "gimp",
        "neovim",
        "vscode",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "papirus-icons",
        "bat",
        "lazygit",
        "yazi"
    ]

[wallpaper.default]
path = "/home/ckjos/Pictures/Wallpapers/sel-walls_1/abstract-swirls.png"

[wallpaper.last]
path = "/home/ckjos/Pictures/Wallpapers/sel-walls_1/abstract-swirls.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/ckjos/Pictures/Wallpapers/sel-walls_1/abstract-swirls.png"

