# | Keybinds |
# Configure your keybinds here. | https://mangowm.github.io/docs/bindings/keys

[bind.default]
# Your favorite applications.
"SUPER+Return" = "spawn, kitty"
"SUPER+e"      = "spawn, kitty --class yazi yazi"
"SUPER+b"      = "spawn, librewolf"

# Please choose the text editor of your choice.
# "SUPER+x" = "spawn, zed"

"SUPER+q" = "killclient"

# Noctalia specific keybinds.
"SUPER+space"   = "spawn, noctalia msg panel-toggle launcher"
# "SUPER+s"       = "spawn, noctalia msg panel-toggle control-center"
# "SUPER+SHIFT+s" = "spawn, noctalia msg settings-toggle"
# "SUPER+w"       = "spawn, noctalia msg panel-toggle wallpaper"
# "SUPER+SHIFT+w" = "spawn, noctalia msg panel-toggle noctalia/wallhaven:browser"
"SUPER+v"       = "spawn, noctalia msg panel-toggle clipboard"
"SUPER+SHIFT+q" = "spawn, noctalia msg panel-toggle session"
"SUPER+SHIFT+E" = "spawn, noctalia msg panel-toggle launcher /emo"

# Keybinds Cheatsheet
# "SUPER+SHIFT+k" = "spawn, noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet"

# Screenshots
"PRINT"              = "spawn, noctalia msg screenshot-region"
"CTRL+PRINT"         = "spawn, noctalia msg screenshot-fullscreen"
# "CTRL+SHIFT+PRINT" = "spawn, noctalia msg screenshot-fullscreen all"

# Reload config
# "SUPER+r" = "reload_config"

# Media controls
"XF86AudioRaiseVolume" = "spawn, noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn, noctalia msg volume-down"
"XF86AudioMute"        = "spawn, noctalia msg volume-mute"
"XF86AudioMicMute"     = "spawn, noctalia msg mic-mute"
"XF86AudioNext"        = "spawn, noctalia msg media next"
"XF86AudioPrev"        = "spawn, noctalia msg media previous"
"XF86AudioPlay"        = "spawn, noctalia msg media toggle"

# Brightness controls
"XF86MonBrightnessUp" = "spawn, noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn, noctalia msg brightness-down"

# Switch window focus
# "SUPER+Tab"   = "focusstack, next"
"SUPER+Left"  = "focusdir, left"
"SUPER+Right" = "focusdir, right"
"SUPER+Up"    = "focusdir, up"
"SUPER+Down"  = "focusdir, down"

"SUPER+W"    = "focusdir, up"
"SUPER+A"  = "focusdir, left"
"SUPER+D" = "focusdir, right"
"SUPER+S"  = "focusdir, down"

# Swap window
"SUPER+SHIFT+W"    = "exchange_client, up"
"SUPER+SHIFT+A"  = "exchange_client, left"
"SUPER+SHIFT+S"  = "exchange_client, down"
"SUPER+SHIFT+D" = "exchange_client, right"

"SUPER+SHIFT+Up"    = "exchange_client, up"
"SUPER+SHIFT+Down"  = "exchange_client, down"
"SUPER+SHIFT+Left"  = "exchange_client, left"
"SUPER+SHIFT+Right" = "exchange_client, right"

# Switch window status
"SUPER+g"       = "toggleglobal"
"SUPER+t"       = "togglefloating"
"SUPER+f"       = "togglemaximizescreen"
"SUPER+SHIFT+f" = "togglefullscreen"
# "SUPER+ALT+f"   = "togglefakefullscreen"
"SUPER+i"       = "minimized"
"SUPER+o"       = "toggleoverlay"
"SUPER+SHIFT+i" = "restore_minimized"
"SUPER+z"       = "toggle_scratchpad"

"ALT+Tab"       = "overcircle, next"
"CTRL+ALT+Tab" = "overcircle, prev"
"SUPER+Tab"       = "overcircle, next"
"SUPER+CTRL+Tab" = "overcircle, prev"

# Scroller layout
# "SUPER+SHIFT+e" = "set_proportion, 1.0"
# "SUPER+x" = "switch_proportion_preset"

# Switch layout
"SUPER+l" = "spawn, noctalia msg panel-toggle ezequiel/mango_layouts:panel"

# Switch between workspaces
"SUPER+1" = "view, 1, 0"
"SUPER+2" = "view, 2, 0"
"SUPER+3" = "view, 3, 0"
"SUPER+4" = "view, 4, 0"
"SUPER+5" = "view, 5, 0"
"SUPER+6" = "view, 6, 0"
"SUPER+7" = "view, 7, 0"
"SUPER+8" = "view, 8, 0"
"SUPER+9" = "view, 9, 0"

# Tag: move client to another workspace.
# Tagsilent: move client to another workspace but do not focus it.
# E.g SUPER+SHIFT, 1, tagsilent, 1
"SUPER+SHIFT+1" = "tag, 1, 0"
"SUPER+SHIFT+2" = "tag, 2, 0"
"SUPER+SHIFT+3" = "tag, 3, 0"
"SUPER+SHIFT+4" = "tag, 4, 0"
"SUPER+SHIFT+5" = "tag, 5, 0"
"SUPER+SHIFT+6" = "tag, 6, 0"
"SUPER+SHIFT+7" = "tag, 7, 0"
"SUPER+SHIFT+8" = "tag, 8, 0"
"SUPER+SHIFT+9" = "tag, 9, 0"

# Switch between monitors
"SUPER+ALT+Left"  = "focusmon, left"
"SUPER+ALT+Right" = "focusmon, right"
# Move window to another monitor
"SUPER+CTRL+Left"  = "tagmon, left"
"SUPER+CTRL+Right" = "tagmon, right"

# Gaps
# "SUPER+SHIFT+X" = "incgaps, 1"
# "SUPER+SHIFT+Z" = "incgaps, -1"
"SUPER+SHIFT+R" = "togglegaps"

# Movewin
#"CTRL+SHIFT+Up"    = "movewin, +0, -50"
# "CTRL+SHIFT+Down"  = "movewin, +0, +50"
# "CTRL+SHIFT+Left"  = "movewin, -50,+0"
# "CTRL+SHIFT+Right" = "movewin, +50,+0"
# Resizewin
"SUPER+minus"    = "resizewin, +0, -50"
"SUPER+plus"  = "resizewin, +0, +50"
"SUPER+SHIFT+minus"  = "resizewin, -50, +0"
"SUPER+SHIFT+plus" = "resizewin, +50, +0"

# Mouse Button Bindings.
# btn_left and btn_right can't bind none mod key

[mousebind.default]

"SUPER+btn_left" = "moveresize, curmove"
# "btn_middle" = "togglemaximizescreen, 0"
"SUPER+btn_right" = "moveresize, curresize"
